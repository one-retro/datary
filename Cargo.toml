[package]
name = "datary"
version = "0.3.0"
edition = "2021"
# Set by the RustCrypto 0.11 hash crates, which require 1.85.
rust-version = "1.85"
description = "Read and write No-Intro, Logiqx, Redump and TOSEC DAT ROM datafiles, fully modelled in the type system."
license = "Apache-2.0"
repository = "https://github.com/one-retro/datary"
homepage = "https://github.com/one-retro/datary"
documentation = "https://docs.rs/datary"
keywords = ["dat", "rom", "retro", "emulation", "no-intro"]
categories = ["emulators", "parser-implementations", "game-development"]
authors = ["Hans Larsen <hans.larsen@gmail.com>"]
readme = "README.md"
# Fixtures are kept in the package so `cargo test` works from the tarball,
# which downstream packagers rely on. CI config is not useful to consumers.
exclude = [".github/**"]

[dependencies]
quick-xml = { version = "0.41", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# Hash value types are reused from the RustCrypto ecosystem so that a hash read
# from a DAT compares directly against one computed over a file on disk.
digest = "0.11"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"

crc32fast = { version = "1.5", optional = true }
winnow = { version = "1.0", optional = true }

# Only for the `dat` command-line tool. `preserve_order` keeps JSON keys in the
# order the model declares them, which the text renderer relies on too.
clap = { version = "4.6", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["preserve_order"], optional = true }
anstream = { version = "1", optional = true }
anstyle = { version = "1", optional = true }
unicode-normalization = { version = "0.1", optional = true }

[dev-dependencies]
pretty_assertions = "1.4"
rstest = "0.26"

[features]
default = ["index", "verify", "cmpro"]
# Lookup tables (by hash, size, name) over a parsed datafile.
index = []
# Helpers to hash files/readers and verify them against a datafile.
verify = ["dep:crc32fast"]
# Reading and writing the native ClrMamePro (non-XML) datafile format.
cmpro = ["dep:winnow"]
# The `dat` command-line tool. Off by default so that depending on the library
# never pulls in an argument parser; install with `--features cli`.
cli = [
    "cmpro",
    "dep:clap",
    "dep:serde_json",
    "dep:anstream",
    "dep:anstyle",
    "dep:unicode-normalization",
]

[[bin]]
name = "dat"
path = "src/bin/dat/main.rs"
required-features = ["cli"]

# Drives the built `dat` binary, so it only exists when the binary does.
[[test]]
name = "cli"
required-features = ["cli"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
